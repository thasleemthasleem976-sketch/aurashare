name: aurashare
description: AuraShare - Secure Offline-First File Sharing Application for Android, Desktop, and Web.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  go_router: ^14.2.0
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  file_picker: ^8.0.5
  path_provider: ^2.1.3
  crypto: ^3.0.3
  encrypt: ^5.0.3
  intl: ^0.19.0
  uuid: ^4.4.0
  network_info_plus: ^5.0.3
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
